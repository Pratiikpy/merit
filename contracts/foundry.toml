[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Arc testnet (chain 5042002) and Arc mainnet (chain 5042). Used by deploy scripts; tests run on the
# local forge EVM (free). Foundry's ${VAR} interpolation has no bash-style default fallback, so
# ARC_MAINNET_RPC_URL must be set (.env.example sets it to the public https://rpc.mainnet.arc.io;
# override with an Alchemy/QuickNode key for higher rate limits during deployment).
[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"
arc_mainnet = "${ARC_MAINNET_RPC_URL}"
